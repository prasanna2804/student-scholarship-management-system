<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="lr.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <div class="container">
        <h2>Forgot Password</h2>

        <!-- Email Input Section -->
        <div id="email-section">
            <label for="email">Enter Your Email</label>
            <input type="email" id="email" required>
            <button onclick="sendCode()">Send Verification Code</button>
        </div>

        <!-- Code Verification Section (Hidden Initially) -->
        <div id="code-section" style="display: none;">
            <label for="code">Enter Verification Code</label>
            <input type="text" id="code" required>
            <button onclick="verifyCode()">Verify Code</button>
        </div>

        <!-- Reset Password Section (Hidden Initially) -->
        <div id="reset-section" style="display: none;">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" required>

            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" required>

            <button onclick="resetPassword()">Reset Password</button>
        </div>

    </div>

    <script>
        function sendCode() {
            var email = $("#email").val();
            $.post("forget_password.php", { action: "send_code", email: email }, function(response) {
                alert(response);
                $("#email-section").hide();
                $("#code-section").show();
            });
        }

        function verifyCode() {
            var code = $("#code").val();
            $.post("forget_password.php", { action: "verify_code", code: code }, function(response) {
                if (response == "success") {
                    $("#code-section").hide();
                    $("#reset-section").show();
                } else {
                    alert("Invalid code, try again!");
                }
            });
        }

        function resetPassword() {
            var new_password = $("#new_password").val();
            var confirm_password = $("#confirm_password").val();
            if (new_password !== confirm_password) {
                alert("Passwords do not match!");
                return;
            }
            $.post("forget_password.php", { action: "reset_password", new_password: new_password }, function(response) {
                alert(response);
                window.location.href = "login_student.html";
            });
        }
    </script>

</body>
</html>
